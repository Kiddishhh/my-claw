name: my-claw

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: syc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MY_CLAW_POSTGRES_USER:?Set in .env.docker}
      POSTGRES_PASSWORD: ${MY_CLAW_POSTGRES_PASSWORD:?Set in .env.docker}
      POSTGRES_DB: ${MY_CLAW_POSTGRES_DB:?Set in .env.docker}
    ports:
      - "127.0.0.1:${MY_CLAW_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../docker-data/postgres:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: syc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${MY_CLAW_REDIS_PORT:-6379}:6379"
    volumes:
      - ../docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
